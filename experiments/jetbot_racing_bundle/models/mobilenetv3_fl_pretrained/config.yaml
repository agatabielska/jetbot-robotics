name: mobilenetv3_fl_pretrained
target_type: forward_left
preprocess_style: rgb_imagenet
input_size: 224
label_shift: 0
label_smoothing:
  enabled: false
anti_bias:
  strategy: wsampler
  n_bins: 7
training:
  batch_size: 64
  num_workers: 4
  epochs: 40            # pretrained converges faster
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  loss_delta: 0.1
  early_stopping_patience: 10
split_csv: ../dataset_analysis_phase1/outputs/tables/split_B_holdout.csv
blacklist_csv: ../dataset_analysis_phase1/outputs/tables/blacklist_candidates.csv
export:
  opset: 11
