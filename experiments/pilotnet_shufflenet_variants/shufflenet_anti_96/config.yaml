name: shufflenet_anti_96
target_type: forward_left
preprocess_style: rgb_imagenet     # pretrained backbone wymaga ImageNet norm
input_size: 96                      # zwalidowany na działającym shufflenet drużynowym
label_shift: 2                      # ~200ms ahead (adresuje przedwczesny skręt)
label_smoothing:
  enabled: false
anti_bias:
  strategy: wsampler                # ~5x oversampling rzadkich skrętów (7 binów |left|)
  n_bins: 7
training:
  batch_size: 64
  num_workers: 4
  epochs: 40                        # pretrained converges szybciej
  optimizer: adamw
  lr: 5.0e-4                        # niższy LR dla pretrained backbone
  weight_decay: 1.0e-5
  scheduler: cosine
  loss_delta: 0.1
  early_stopping_patience: 10
split_csv: ../dataset_analysis_phase1/outputs/tables/split_B_holdout.csv
blacklist_csv: ../dataset_analysis_phase1/outputs/tables/blacklist_candidates.csv
export:
  opset: 11
