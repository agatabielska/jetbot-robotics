anti_bias:
  n_bins: 7
  strategy: wsampler
blacklist_csv: ../dataset_analysis_phase1/outputs/tables/blacklist_candidates.csv
export:
  opset: 11
input_size: 224
label_shift: 0
label_smoothing:
  enabled: false
  window: 3
name: pilotnet_fl_wsampler
preprocess_style: bgr_01
split_csv: ../dataset_analysis_phase1/outputs/tables/split_B_holdout.csv
target_type: forward_left
training:
  batch_size: 64
  early_stopping_patience: 10
  epochs: 50
  loss_delta: 0.1
  lr: 0.001
  num_workers: 4
  optimizer: adamw
  scheduler: cosine
  weight_decay: 1.0e-05
