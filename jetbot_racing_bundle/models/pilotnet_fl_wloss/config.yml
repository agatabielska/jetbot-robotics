# Template config — uncomment one row from the calibration table below or run calibrate.py
model:
  path: ''   # auto-resolved via --model arg; left for compatibility

robot:
  max_speed: 0.22      # max wheel speed (0..1). LOWER for first laps, increase after.
  max_steering: 0.5    # how aggressively steering modifies wheel speed

  # Calibration per JetBot (from PUT_jetbot/README.md tabela):
  # | Vehicle  | left | right |
  # | Jetbot 01 | 1.00 | 0.90 |
  # | Jetbot 02 | 0.85 | 1.00 |
  # | Jetbot 03 | 1.00 | 1.00 |
  # | Jetbot 04 | 1.00 | 1.00 |
  # If you don't know your JetBot number — run `python3 calibrate.py` first!
  differential:
    left: 1.00
    right: 1.00
